# Bug Bounty AI Agent Configuration

# ═══════════════════════════════════════════════════════
# AI Provider Configuration
# Supported: auto | claude | deepseek | openai | openrouter | custom
# ═══════════════════════════════════════════════════════
ai:
  provider: "auto"                  # Resolves only when exactly one provider-specific key is configured.
                                    # Or set claude/deepseek/openai/openrouter explicitly.
  api_key: ""                       # Leave empty — key is read from .env automatically
  model: ""                         # Empty selects the resolved provider's reviewed default.
  max_tokens: 8000                  # Headroom for complete structured validation batches.
  base_url: ""                      # Hosted-provider endpoints are pinned in code.
  timeout: 300                      # Per-request HTTP timeout (seconds). Raise for slow providers/large JS batches

# Provider keys: ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, OPENAI_API_KEY,
# OPENROUTER_API_KEY, or AI_API_KEY for a fully configured custom endpoint.
# Model IDs and pricing change over time; verify them with the provider before
# overriding the release defaults.

# Legacy Claude config (backward compatibility - used if ai.api_key is empty)
claude:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-sonnet-5"
  max_tokens: 2000

# C99.nl API Intelligence
c99:
  api_key: "${C99_API_KEY}"
  enabled: false  # Opt in only after configuring a valid key.

# Target Configuration
target:
  domains: []
  excluded_subdomains: []

# Optional authenticated testing. Use only accounts and sessions you own.
# Values are expanded from environment variables, redacted from AI prompts,
# reports, and logs, and omitted from external-tool environments. Avoid literal
# credentials.
authentication:
  # Required when headers or cookies are configured. Only explicit HTTPS
  # origins are accepted. Credentials are used by the guarded internal JS
  # downloader and are never passed to external scanner processes.
  allowed_hosts: []
  # Example:
  #   - "https://app.example.com"
  #   - "https://*.api.example.com:443"
  headers: {}
  # Example:
  #   Authorization: "Bearer ${TARGET_TOKEN}"
  cookies: {}
  # Example:
  #   session: "${TARGET_SESSION}"

# Reconnaissance Settings
recon:
  enabled: true
  timeout: 300 # seconds
  max_subdomains: 1000
  max_wayback_urls: 10000 # prevent OOM for large domains
  tools:
    subfinder: true
    assetfinder: true
    wayback: true
    katana: true  # JS file extraction crawler
    cert_transparency: true

# Scanning Settings
#
# Active scanners run SEQUENTIALLY (nuclei → dalfox), never in parallel. Running
# several heavy scanners at once on a modest host exhausts memory and the OOM
# killer terminates them mid-scan. One scanner at a time finishes reliably.
scanning:
  enabled: true
  threads: 10  # Conservative default; raise only when the program explicitly permits it
  timeout: 1200  # 20-minute budget for the nuclei high-value scan (runs alone)
  # Global requests/sec ceiling used by scanners, Katana, and internal JS downloads.
  # Keep this at or below the bug-bounty program's published traffic limit.
  rate_limit: 25
  tools:
    nuclei:
      enabled: true
      severity: []  # Empty runs actionable severities: critical, high, medium, low
      # High-signal profile. "misconfig" (≈800 templates) was dropped: it nearly
      # doubled request volume without producing confirmed findings here. Add it
      # back if your host and the program's rate limits allow a longer scan.
      tags: ["exposure", "takeover", "default-login"]
      templates_path: "" # Empty uses Nuclei's installed templates
    httpx:
      enabled: true
      follow_redirects: true
      status_code: true
    dalfox:
      enabled: true
      blind_url: ""  # Optional: blind XSS callback URL (e.g. https://your-burp-collaborator)
      max_urls: 75   # Parameterized URLs to fuzz for reflected XSS
    nmap:
      enabled: false # Open ports alone are reconnaissance, not confirmed vulnerabilities
      ports: "21,22,25,53,80,110,143,443,445,993,995,3000,3306,5432,6379,8000,8080,8443,8888,9090,9200,27017"
      fast_scan: true
# AI Analysis
analysis:
  min_confidence: 0.85 # Findings below this require manual confirmation and are not reported
  js_analysis: true  # AI-powered JS file analysis

# Reporting
reporting:
  include_poc: true
  severity_filter: []  # Optional actionable severities: critical, high, medium, low
  output_dir: "./reports"

# Phase 1 — AI Attack-Surface Hunter (hypothesis engine)
# Reasons over the recon-derived surface to produce ranked attack LEADS
# (IDOR, access control, business logic, SSRF, injection, auth bypass) that
# signature scanners cannot find. It NEVER sends a request to the target —
# every hypothesis is a lead for manual verification.
hunter:
  enabled: false            # Opt in: outputs are unverified leads, never findings.
  max_hypotheses: 40   # cap on ranked leads returned/saved
  max_endpoints: 120   # cap on surface entries sent to the model (parameterized URLs prioritized)
