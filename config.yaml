# Bug Bounty AI Agent Configuration

# ═══════════════════════════════════════════════════════
# AI Provider Configuration
# Supported: claude | deepseek | openai | openrouter | custom
# ═══════════════════════════════════════════════════════
ai:
  provider: "auto"                  # auto = detect from .env (claude/deepseek/openai/openrouter)
  api_key: ""                       # Leave empty — key is read from .env automatically
  model: ""                         # Leave empty for provider default
  max_tokens: 2000
  base_url: ""                     # Only needed for openrouter/custom
  timeout: 300                      # Per-request HTTP timeout (seconds). Raise for slow providers/large JS batches

# Provider presets (just change 'provider' and 'api_key'):
# ┌─────────────┬──────────────────────────┬────────────────────────────┬──────────────┐
# │ Provider    │ Model (default)          │ Env Variable               │ Cost/1M tok  │
# ├─────────────┼──────────────────────────┼────────────────────────────┼──────────────┤
# │ claude      │ claude-sonnet-4-20250514 │ ANTHROPIC_API_KEY          │ $3/$15       │
# │ deepseek    │ deepseek-chat            │ DEEPSEEK_API_KEY           │ $0.28/$0.42  │
# │ openai      │ gpt-4o-mini              │ OPENAI_API_KEY             │ $0.15/$0.60  │
# │ openrouter  │ deepseek/deepseek-chat   │ OPENROUTER_API_KEY         │ varies       │
# │ custom      │ (must specify)           │ AI_API_KEY                 │ varies       │
# └─────────────┴──────────────────────────┴────────────────────────────┴──────────────┘

# Legacy Claude config (backward compatibility - used if ai.api_key is empty)
claude:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-sonnet-4-20250514"
  max_tokens: 2000

# C99.nl API Intelligence
c99:
  api_key: "${C99_API_KEY}"
  enabled: true

# Target Configuration
target:
  domains: []
  excluded_subdomains: []

# Optional authenticated testing. Use only accounts and sessions you own.
# Values are expanded from environment variables and redacted from AI prompts
# and reports. Avoid placing literal credentials in this file.
authentication:
  # Required when headers or cookies are configured. Credentials are injected
  # only when every target in a tool invocation matches this allowlist.
  allowed_hosts: []
  # Example:
  #   - "app.example.com"
  #   - "*.api.example.com"
  headers: {}
  # Example:
  #   Authorization: "Bearer ${TARGET_TOKEN}"
  cookies: {}
  # Example:
  #   session: "${TARGET_SESSION}"

# Reconnaissance Settings
recon:
  enabled: true
  timeout: 300 # seconds
  max_subdomains: 1000
  max_wayback_urls: 10000 # prevent OOM for large domains
  tools:
    subfinder: true
    assetfinder: true
    wayback: true
    katana: true  # JS file extraction crawler
    cert_transparency: true

# Scanning Settings
#
# Active scanners run SEQUENTIALLY (nuclei → dalfox), never in parallel. Running
# several heavy scanners at once on a modest host exhausts memory and the OOM
# killer terminates them mid-scan. One scanner at a time finishes reliably.
scanning:
  enabled: true
  threads: 40  # Balanced default for reliable scans on modest servers
  timeout: 1200  # 20-minute budget for the nuclei high-value scan (runs alone)
  # Requests/sec ceiling. At 50 a full scan of ~1300 templates × dozens of hosts
  # could not finish inside the budget (≈57 min of requests). 150 is Nuclei's own
  # default and completes the scan with margin. Lower it for strict programs.
  rate_limit: 150
  tools:
    nuclei:
      enabled: true
      severity: []  # Empty runs actionable severities: critical, high, medium, low
      # High-signal profile. "misconfig" (≈800 templates) was dropped: it nearly
      # doubled request volume without producing confirmed findings here. Add it
      # back if your host and the program's rate limits allow a longer scan.
      tags: ["exposure", "takeover", "default-login"]
      templates_path: "" # Empty uses Nuclei's installed templates
    httpx:
      enabled: true
      follow_redirects: true
      status_code: true
    dalfox:
      enabled: true
      blind_url: ""  # Optional: blind XSS callback URL (e.g. https://your-burp-collaborator)
      max_urls: 75   # Parameterized URLs to fuzz for reflected XSS
    nmap:
      enabled: false # Open ports alone are reconnaissance, not confirmed vulnerabilities
      ports: "21,22,25,53,80,110,143,443,445,993,995,3000,3306,5432,6379,8000,8080,8443,8888,9090,9200,27017"
      fast_scan: true
# AI Analysis
analysis:
  min_confidence: 0.85 # Findings below this require manual confirmation and are not reported
  js_analysis: true  # AI-powered JS file analysis

# Reporting
reporting:
  include_poc: true
  severity_filter: []  # Optional actionable severities: critical, high, medium, low
  output_dir: "./reports"
