name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal evals)"

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Verify tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^const appVersion = "\([^"]*\)"/\1/p' cmd/main.go)"
          test -n "$app_version"
          test "$GITHUB_REF_NAME" = "v${app_version}"

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            package="hawkeye-${GITHUB_REF_NAME}-linux-${arch}"
            mkdir -p "dist/${package}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "dist/${package}/hawkeye" ./cmd/main.go
            cp config.yaml .env.example README.md LICENSE SECURITY.md "dist/${package}/"
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
            rm -rf "dist/${package}"
          done
          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
